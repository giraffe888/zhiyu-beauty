<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4038"/>
      <stop offset="100%" stop-color="#1E8A6E"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#8FE8C4" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#8FE8C4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8FE8C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="240" fill="url(#bg)"/>
  <rect width="640" height="240" fill="url(#glow)"/>

  <!-- 细网格 -->
  <g stroke="#FFFFFF" stroke-width="0.7" opacity="0.055">
    <line x1="0" y1="0" x2="0" y2="240"/><line x1="80" y1="0" x2="80" y2="240"/><line x1="160" y1="0" x2="160" y2="240"/><line x1="240" y1="0" x2="240" y2="240"/><line x1="320" y1="0" x2="320" y2="240"/><line x1="400" y1="0" x2="400" y2="240"/><line x1="480" y1="0" x2="480" y2="240"/><line x1="560" y1="0" x2="560" y2="240"/>
    <line x1="0" y1="0" x2="640" y2="0"/><line x1="0" y1="80" x2="640" y2="80"/><line x1="0" y1="160" x2="640" y2="160"/>
  </g>

  <!-- 光泽带 -->
  <polygon points="60,240 200,0 268,0 128,240" fill="url(#sheen)"/>

  <!-- 装饰光点 -->
  <g fill="#FFFFFF" opacity="0.28">
    <circle cx="72" cy="52" r="3"/><circle cx="110" cy="196" r="2.4"/>
    <circle cx="576" cy="66" r="2.6"/><circle cx="546" cy="190" r="3.2"/>
  </g>

  <!-- 主视觉：产品/器械元素 -->
  <g stroke="#FFFFFF" stroke-width="2.6" fill="none" opacity="0.6">
    <line x1="252" y1="140" x2="416" y2="140"/><line x1="264" y1="164" x2="404" y2="164"/>
    <line x1="278" y1="188" x2="390" y2="188"/>
  </g>
  <g stroke="#D89449" stroke-width="2.8" fill="none" stroke-linecap="round">
    <path d="M334 68 q22 30 22 44 a22 22 0 0 1 -44 0 q0 -14 22 -44z" fill="#D89449" fill-opacity="0.22"/>
  </g>
  <g fill="#E8B678" opacity="0.75">
    <circle cx="300" cy="118" r="4"/><circle cx="368" cy="112" r="3.5"/><circle cx="386" cy="132" r="3"/>
  </g>

  <!-- 类别标签 -->
  <text x="618" y="222" font-size="13" font-weight="700" fill="#FFFFFF" opacity="0.42"
        text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
        letter-spacing="1">皮肤管理</text>
</svg>