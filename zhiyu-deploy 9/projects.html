<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>项目库 · 知予</title>
  <link rel="icon" type="image/png" href="brand/favicon-32.png">
  <link rel="apple-touch-icon" href="brand/icon-180.png">
    <meta property="og:type" content="website">
  <meta property="og:title" content="知予 · 中韩医美产业信息平台">
  <meta property="og:description" content="面向医美机构、企业与投资者的中韩产业信息平台：项目档案、市场行情、政策合规与资源对接。">
  <meta property="og:image" content="brand/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <div class="wrap">
      <div class="page-head">
        <h1 class="page-title">医美项目库</h1>
        <p class="page-desc">
          收录中韩市场主流医美项目，含技术原理、适应症、风险提示、中韩参考价格与监管要求。共
          <b id="totalCount">-</b> 个项目，数据版本 <span id="dataVersion">-</span>。
        </p>
      </div>

      <div class="filter-bar">
        <input class="search-input" id="searchInput" placeholder="搜索项目、别名、品牌…" autocomplete="off">
      </div>
      <div class="filter-bar">
        <div class="chips" id="categoryChips"></div>
      </div>
      <div class="filter-bar">
        <div class="chips" id="regionChips"></div>
        <span class="fs-12 text-light" id="resultCount" style="margin-left:auto"></span>
      </div>

      <div class="project-grid" id="projectGrid"></div>
      <div id="emptyState" class="building" hidden style="padding:44px 20px">
        <div class="building-icon">🔍</div>
        <h3>没有找到匹配的项目</h3>
        <p>换个关键词，或清空筛选条件试试</p>
      </div>

      <div class="notice notice-info mt-24">
        <span>ℹ️</span>
        <div>价格与关注度为平台整理，仅供行业参考，实际以机构报价与官方发布为准。医美项目均存在风险，需由具备资质的机构与医师评估实施。</div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <div class="modal-mask" id="detailMask">
    <div class="modal" id="detailModal">
      <button class="modal-close" id="detailClose" aria-label="关闭">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/data-source.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/membership.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
